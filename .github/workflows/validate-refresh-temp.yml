name: Validate full dependency refresh (temporary)
on:
  push:
    branches: [chore/refresh-all-dependencies-20261115]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependency graph and run race tests
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -race ./...
          go vet ./...
          git diff --exit-code -- go.mod go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
